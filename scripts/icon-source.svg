<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2b3b2e"/>
      <stop offset="100%" stop-color="#17211a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d99a"/>
      <stop offset="55%" stop-color="#d3b26d"/>
      <stop offset="100%" stop-color="#a8843f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background so square/circle/rounded-square Android masks all look intentional -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- safe-zone guide: important art stays within the centered ~80% circle (radius 205 from 256,256) -->
  <g>
    <!-- laurel wreath, left branch -->
    <path d="M188 150
             C140 175, 118 230, 128 288
             C136 336, 164 372, 200 392"
          fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <g fill="url(#gold)">
      <ellipse cx="150" cy="196" rx="12" ry="20" transform="rotate(-35 150 196)"/>
      <ellipse cx="132" cy="232" rx="12" ry="20" transform="rotate(-15 132 232)"/>
      <ellipse cx="126" cy="272" rx="12" ry="20" transform="rotate(5 126 272)"/>
      <ellipse cx="136" cy="312" rx="12" ry="20" transform="rotate(25 136 312)"/>
      <ellipse cx="158" cy="348" rx="12" ry="20" transform="rotate(45 158 348)"/>
      <ellipse cx="184" cy="376" rx="12" ry="20" transform="rotate(60 184 376)"/>
    </g>

    <!-- laurel wreath, right branch (mirrored) -->
    <path d="M324 150
             C372 175, 394 230, 384 288
             C376 336, 348 372, 312 392"
          fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <g fill="url(#gold)">
      <ellipse cx="362" cy="196" rx="12" ry="20" transform="rotate(35 362 196)"/>
      <ellipse cx="380" cy="232" rx="12" ry="20" transform="rotate(15 380 232)"/>
      <ellipse cx="386" cy="272" rx="12" ry="20" transform="rotate(-5 386 272)"/>
      <ellipse cx="376" cy="312" rx="12" ry="20" transform="rotate(-25 376 312)"/>
      <ellipse cx="354" cy="348" rx="12" ry="20" transform="rotate(-45 354 348)"/>
      <ellipse cx="328" cy="376" rx="12" ry="20" transform="rotate(-60 328 376)"/>
    </g>

    <!-- crossed sabres behind the card -->
    <g stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
      <line x1="176" y1="228" x2="336" y2="316"/>
      <line x1="336" y1="228" x2="176" y2="316"/>
    </g>
    <g fill="url(#gold)">
      <circle cx="176" cy="228" r="9"/>
      <circle cx="336" cy="228" r="9"/>
      <circle cx="176" cy="316" r="9"/>
      <circle cx="336" cy="316" r="9"/>
    </g>

    <!-- playing card -->
    <g>
      <rect x="208" y="176" width="96" height="136" rx="10"
            fill="#f5ecd8" stroke="url(#gold)" stroke-width="6"/>
      <text x="256" y="270" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" font-weight="700"
            font-size="92" fill="#1c2a1f">A</text>
    </g>
  </g>
</svg>
